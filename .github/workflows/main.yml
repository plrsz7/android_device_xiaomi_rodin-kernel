name: KernelSU Integration GKI

on:
  workflow_dispatch:

jobs:
  integrate:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      
      - name: Setup environment
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl
          git config user.name "KernelSU Bot"
          git config user.email "bot@github.com"
      
      - name: make
        run: |
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -

      - name: Verify integration
        run: |
          # Verifica se integrou corretamente
          ls -la kernel/ksu/
          cat kernel/Kconfig | grep -i ksu || echo "KSU config não encontrado"
      
      - name: Commit changes
        run: |
          git add .
          git commit -m "feat: integrate KernelSU-Next for GKI 6.6.89" || true
          git push origin main
        continue-on-error: true
